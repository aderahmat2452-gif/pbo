  <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4ecea;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* KIRI */
        .left {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shapes {
            position: relative;
            width: 300px;
            height: 200px;
        }

        .shape {
            position: absolute;
            border-radius: 20px;
        }

        .orange {
            width: 200px;
            height: 120px;
            background: orange;
            bottom: 0;
            left: 0;
        }

        .purple {
            width: 80px;
            height: 140px;
            background: #5a3fff;
            left: 30px;
            top: 0;
        }

        .black {
            width: 60px;
            height: 130px;
            background: #111;
            left: 120px;
            top: 20px;
        }

        .yellow {
            width: 70px;
            height: 120px;
            background: #ffd500;
            left: 190px;
            top: 40px;
        }

        /* KANAN */
        .right {
            flex: 1;
            background: #f8f1ef;
            padding: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        form {
            max-width: 300px;
            display: flex;
            flex-direction: column;
        }

        input {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .login {
            background: black;
            color: white;
        }

        .google {
            background: white;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- KIRI -->
    <div class="left">
        <div class="shapes">
            <div class="shape orange"></div>
            <div class="shape purple"></div>
            <div class="shape black"></div>
            <div class="shape yellow"></div>
        </div>
    </div>

    <!-- KANAN -->
    <div class="right">
        <h2>Welcome back!</h2>
        <p>Please enter your details</p>

        <form onsubmit="login(event)">
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>

            <button type="submit" class="login">Log in</button>
            <button type="button" class="google">Log in with Google</button>
        </form>
    </div>

</div>

<script>
    function login(event) {
        event.preventDefault(); // HENTIKAN reload

        // simulasi login berhasil
        window.location.href = "dashboard.html";
    }
</script>

</body>
</html>
